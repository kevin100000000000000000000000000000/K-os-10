---
modules-search: [local, /usr/lib/*/calamares/modules]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - services-systemd
      - bootloader
      - packages
      - cleanup
  - show:
      - finished

branding: kos
prompt-install: true
dont-chroot: false
