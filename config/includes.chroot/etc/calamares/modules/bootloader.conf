---
efiBootLoader: grub
kernel: /vmlinuz
img: /initrd.img
fallback: /initrd.img
timeout: 10
efiBootLoaderVar: KOS
efiSystemPartition: /boot/efi
grubInstall: grub-install
*** Add File: config/includes.chroot/etc/calamares/modules/users.conf
---
defaultGroups:
  - users
  - adm
  - cdrom
  - sudo
  - dip
  - plugdev
  - lpadmin
  - audio
  - video
  - netdev
  - bluetooth
  - scanner
  - storage
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false
doAutologin: false
