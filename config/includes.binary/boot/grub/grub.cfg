set timeout=10
set default=0
insmod efi_gop
insmod efi_uga
insmod all_video

menuentry "KOS 1.0 Live" {
    linux /live/vmlinuz boot=live components splash quiet
    initrd /live/initrd.img
}

menuentry "KOS 1.0 Live (Safe graphics)" {
    linux /live/vmlinuz boot=live components nomodeset
    initrd /live/initrd.img
}
